<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 84 272 182" role="img" aria-label="Loading Routa">
<style>
.pin, .hole, .o, .dot { transform-box: fill-box; transform-origin: center; }
.route { stroke-dasharray: 1 2; }
.pin { animation: pin 2s infinite, pin-fade 2s infinite; }
.o { animation: o-dip 2s infinite; }
.hole { animation: hole 2s infinite; }
.route { animation: route 2s infinite; }
.dot { animation: dot-scale 2s infinite, dot-fade 2s infinite; }
@keyframes pin {
  0% { transform: translateY(-50px) scale(0.96, 1.05); animation-timing-function: cubic-bezier(0.42, 0, 1, 1); }
  19% { transform: translateY(0) scale(0.96, 1.05); animation-timing-function: cubic-bezier(0, 0, 0.58, 1); }
  24% { transform: translateY(4px) scale(1.09, 0.88); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
  40%, 85% { transform: translateY(0) scale(1, 1); animation-timing-function: cubic-bezier(0.42, 0, 1, 1); }
  100% { transform: translateY(-12px) scale(1, 1); }
}
@keyframes pin-fade {
  0% { opacity: 0; animation-timing-function: ease-out; }
  7%, 85% { opacity: 1; animation-timing-function: ease-in; }
  100% { opacity: 0; }
}
@keyframes o-dip {
  0%, 19% { transform: translateY(0); animation-timing-function: ease-out; }
  24% { transform: translateY(2.5px); animation-timing-function: ease-out; }
  37.5%, 100% { transform: translateY(0); }
}
@keyframes hole {
  0%, 42.5% { transform: scale(1); animation-timing-function: ease-out; }
  52.5% { transform: scale(1.28); animation-timing-function: ease-in-out; }
  67.5%, 100% { transform: scale(1); }
}
@keyframes route {
  0%, 22.5% { stroke-dashoffset: 1; opacity: 1; animation-timing-function: ease-in-out; }
  67.5% { stroke-dashoffset: 0; opacity: 1; }
  85% { stroke-dashoffset: 0; opacity: 1; animation-timing-function: ease-in; }
  100% { stroke-dashoffset: 0; opacity: 0; }
}
@keyframes dot-scale {
  0%, 65% { transform: scale(0.01); animation-timing-function: cubic-bezier(0.45, 1.45, 0.8, 1); }
  75%, 100% { transform: scale(1); }
}
@keyframes dot-fade {
  0%, 65% { opacity: 0; animation-timing-function: ease-out; }
  69%, 85% { opacity: 1; animation-timing-function: ease-in; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
