<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Loading">
<style>
.hop, .shadow { transform-box: fill-box; transform-origin: center bottom; }
.hop { animation: hop 1.2s infinite; }
.shadow { transform-origin: center; animation: shadow 1.2s infinite; }
@keyframes hop {
  0%, 100% { transform: translateY(0) scale(1.1, 0.9); animation-timing-function: ease-out; }
  12% { transform: translateY(0) scale(1, 1); animation-timing-function: cubic-bezier(0, 0, 0.58, 1); }
  50% { transform: translateY(-14px) scale(0.97, 1.04); animation-timing-function: cubic-bezier(0.42, 0, 1, 1); }
  88% { transform: translateY(0) scale(1, 1); animation-timing-function: ease-out; }
}
@keyframes shadow {
  0%, 12%, 88%, 100% { transform: scale(1); opacity: 0.22; animation-timing-function: ease-in-out; }
  50% { transform: scale(0.55); opacity: 0.1; animation-timing-function: ease-in-out; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
