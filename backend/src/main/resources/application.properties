spring.application.name=routa

# ---------------------------------------------------------------------
# Read secrets from the .env file, so no password is written in this file.
# "optional:" means no error if that file does not exist.
# The first path works when you run from the project root, the second
# when you run from the backend/ folder.
# ---------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ---------------------------------------------------------------------
# Database connection (values come from .env)
# ---------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ---------------------------------------------------------------------
# JPA / Hibernate
# "validate" = only CHECK that our Java entities match the tables created by
# database/schema.sql. Hibernate never creates or changes tables.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# Server and CORS (which website address may call this API)
# ---------------------------------------------------------------------
server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------
# Security (values come from .env)
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Demo accounts created at startup. The passwords are optional: when empty, that account is skipped.
app.demo.admin-email=${DEMO_ADMIN_EMAIL:admin@routa.local}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:}
app.demo.user-email=${DEMO_USER_EMAIL:user@routa.local}
app.demo.user-password=${DEMO_USER_PASSWORD:}
